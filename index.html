<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Práctica web — Informática III</title>
  </head>
  <body class="bg-gray-100 text-gray-800">

    <!-- EJERCICIO 1: construye aquí tu página (header, main con #catalogo, footer).
         Las instrucciones están en el README. -->

         <header class = "bg-blue-600 text-white p-6 text-center flex flex-col items-center">
         <h1 class="text-3xl font bold">Alitach</h1>
         <p>Taller de diseño, confección y personalización de textiles</p>
         </header>

         <main class="p-6">
          <div class="mb-4 flex gap-2">
         <button data-categoria="Todas" class="bg-white text-blue-800 p-2">Todas</button>
         <button data-categoria="Chalecos" class="bg-white text-blue-800 p-2">Chalecos</button>
         <button data-categoria="Bolsas" class="bg-white text-blue-800 p-2">Bolsas</button>
         <button data-categoria="Personalización" class="bg-white text-blue-800 p-2">Personalización</button>
         </div>
          <div id="catalogo" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            </div>

        <aside class="bg-white rounded-lg shadow p-4 mt-6">
        <h2 class="text-xl font-bold">Mi pedido</h2>
        <ul id="lista-pedido"></ul>
        <p id="total" class="font-bold mt-2">0</p>

        <form id="form-cliente" class="flex flex-col">
        <label for="nombre" class="block font-semibold text-gray-700 mb-1">Nombre:</label>
        <input id="nombre" type="text" class="border rounded p-2 mb-2 w-64">
        <p id="error-nombre" class="text-sm text-red-600 hidden"></p>

        <label for="telefono" class="block font-semibold text-gray 700 mb-1">Teléfono:</label>
        <input id="telefono" type="text" class="border rounded p-2 mb-2 w-64">
        <p id="error-telefono" class="text-sm text-red-600 hidden"></p>

        <label for="correo" class="block font-semibold text-gray 700 b-1">Correo:</label>
        <input id="correo" type="text" class="border rounded p-2 mb-2 w-64">
        <p id="error-correo" class="text-sm text-red-600 hidden"></p>

        <p id="error-pedido" class="text-sm text-red-600 hidden"></p>
        <button type="submit" class="bg-blue-600 text-white p-2 rounded w-64">Confirmar pedido</button>
        </form>

        <button id="btn-vaciar" class="bg-red-600 text-white p-2 mt-2 hover:bg-red-700 w-64" >Vaciar pedido</button>
        </aside>

        <section class="mt-6">
        <h2 class="text-xl font-bold mb-2">Pedidos registrados</h2>
        <!--el extra 7 para buscar por nombre-->
        <label for="buscador-pedidos" class="font-semibold block mb-1">Buscar cliente:</label>
        <input id="buscador-pedidos" type="text" placeholder="Ingresa el nombre del cliente" class="border p-2 w-64 mb-4">
        <div id="pedidos-registrados" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
        </section>



        </main>

        <footer class="bg-blue-600 text-white p-4 text-center"> Equipo ASKI </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
